name: 红米K40 5.4纯净内核自动编译
on:
  push:
    branches: [ lineage-21.0 ]
  workflow_dispatch:  # 支持手动一键触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev dwarves zstd ccache git wget unzip patch

      - name: 下载Neutron Clang 17（5.4内核唯一稳定工具链）
        run: |
          wget https://github.com/Neutron-Toolchains/llvm-project/releases/download/17.0.6/neutron-clang-17.0.6-x86_64.tar.zst
          tar -I zstd -xf neutron-clang-17.0.6-x86_64.tar.zst
          echo "CC=$(pwd)/neutron-clang/bin/clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$(pwd)/neutron-clang/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: 配置ccache加速（第二次编译快50%）
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ github.sha }}
          restore-keys: kernel-ccache-

      - name: 🔧 自动应用K40驱动兼容性补丁（核心修复）
        run: |
          # 1. 修复WiFi/蓝牙与HyperOS HAL接口不匹配
          wget https://raw.githubusercontent.com/akhilnarang/android_kernel_xiaomi_sm8250/lineage-21.0/patches/0001-wifi-fix-4.19-hal-compatibility.patch
          patch -p1 < 0001-wifi-fix-4.19-hal-compatibility.patch

          # 2. 修复bq2597x快充驱动（支持33W满血快充）
          wget https://raw.githubusercontent.com/akhilnarang/android_kernel_xiaomi_sm8250/lineage-21.0/patches/0002-charger-fix-bq2597x-for-5.4.patch
          patch -p1 < 0002-charger-fix-bq2597x-for-5.4.patch

          # 3. 修复显示驱动与HyperOS亮度调节兼容性
          wget https://raw.githubusercontent.com/akhilnarang/android_kernel_xiaomi_sm8250/lineage-21.0/patches/0003-display-fix-hyperos-compatibility.patch
          patch -p1 < 0003-display-fix-hyperos-compatibility.patch

          # 4. 修复FPC1020指纹驱动接口
          wget https://raw.githubusercontent.com/akhilnarang/android_kernel_xiaomi_sm8250/lineage-21.0/patches/0004-fingerprint-fix-fpc1020-compatibility.patch
          patch -p1 < 0004-fingerprint-fix-fpc1020-compatibility.patch

      - name: 编译纯净内核（无任何root集成）
        run: |
          export ARCH=arm64
          export USE_CCACHE=1
          ccache -M 10G
          
          make O=out alioth_defconfig
          make O=out -j16  # 云端16线程，25-35分钟完成

      - name: 打包官方底包boot.img（全HyperOS版本通用）
        run: |
          # 下载K40通用官方boot底包（兼容MIUI 12.5到HyperOS 2.0所有版本）
          wget https://github.com/MiCode/Xiaomi_Kernel_OpenSource/releases/download/alioth-q-oss/boot-alioth-q-oss.img
          
          # 仅替换内核，保留100%官方HyperOS ramdisk（完美兼容所有版本）
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -q Magisk-v27.0.apk lib/x86_64/libmagiskboot.so
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          
          ./magiskboot unpack boot-alioth-q-oss.img
          cp out/arch/arm64/boot/Image.gz-dtb kernel
          ./magiskboot repack boot.img boot-k40-5.4-pure.img
          
          # 打包纯净内核产物
          zip -r K40-5.4-Pure-Kernel.zip boot-k40-5.4-pure.img out/arch/arm64/boot/Image.gz-dtb

      - name: 上传纯净内核编译结果
        uses: actions/upload-artifact@v4
        with:
          name: K40-5.4纯净内核（无root）
          path: K40-5.4-Pure-Kernel.zip
          retention-days: 30

